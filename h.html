<!DOCTYPE html>
<html>
  <head>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f4; text-align: center; }
    .arrows { font-size:40px; color:red; }
    td.button { background-color:black; border-radius:15px; box-shadow: 3px 3px #888888; padding: 10px; }
    td.button:active { transform: translate(3px,3px); box-shadow: none; }
    .noselect { -webkit-user-select: none; user-select: none; }
    
    /* Notification Panel */
    #notificationArea {
        width: 90%; margin: 10px auto; padding: 10px;
        background-color: #ffcccb; color: #d8000c; border: 1px solid #d8000c;
        display: none; border-radius: 5px; font-weight: bold;
    }

    /* Patrol Panel */
    .panel { background: white; margin: 10px; padding: 10px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
    .btn-patrol { background-color: #008CBA; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    .btn-patrol.stop { background-color: #f44336; }
    
    .slider { -webkit-appearance: none; width: 100%; height: 15px; border-radius: 5px; background: #d3d3d3; outline: none; }
    .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 25px; height: 25px; border-radius: 50%; background: red; cursor: pointer; }
    </style>
  </head>
  <body class="noselect">
      
    <h2>Sentinel-X Surveillance</h2>
    
    <div id="notificationArea">System Ready</div>

    <div class="panel">
        <img id="cameraImage" src="" style="width:100%; max-width:400px; height:auto; border-radius:5px;">
    </div>

    <table id="mainTable" style="width:300px;margin:auto;table-layout:fixed" CELLSPACING=10>
      <tr>
        <td></td>
        <td class="button" ontouchstart='sendButtonInput("MoveCar","1")' ontouchend='sendButtonInput("MoveCar","0")'><span class="arrows" >&#8679;</span></td>
        <td></td>
      </tr> 
      <tr>
        <td class="button" ontouchstart='sendButtonInput("MoveCar","3")' ontouchend='sendButtonInput("MoveCar","0")'><span class="arrows" >&#8678;</span></td>
        <td class="button"></td>    
        <td class="button" ontouchstart='sendButtonInput("MoveCar","4")' ontouchend='sendButtonInput("MoveCar","0")'><span class="arrows" >&#8680;</span></td>
      </tr>
      <tr>
        <td></td>
        <td class="button" ontouchstart='sendButtonInput("MoveCar","2")' ontouchend='sendButtonInput("MoveCar","0")'><span class="arrows" >&#8681;</span></td>
        <td></td>
      </tr>
    </table>

    <div class="panel">
        <b>Speed:</b> <input type="range" min="0" max="255" value="150" class="slider" id="Speed" oninput='sendButtonInput("Speed",value)'><br><br>
        <b>Light:</b> <input type="range" min="0" max="255" value="0" class="slider" id="Light" oninput='sendButtonInput("Light",value)'>
    </div>

    <div class="panel">
        <h3>Autonomous Patrol</h3>
        <label>Time (min): </label>
        <input type="number" id="patrolTime" value="1" min="1" max="10" style="width:50px;">
        <button id="patrolBtn" class="btn-patrol" onclick="togglePatrol()">Start Patrol</button>
        <br><br>
        <a href="/gallery" target="_blank" style="text-decoration:none; color:blue;">&#128193; View Evidence Locker</a>
    </div>
  
    <script>
      var webSocketCameraUrl = "ws:\/\/" + window.location.hostname + "/Camera";
      var webSocketCarInputUrl = "ws:\/\/" + window.location.hostname + "/CarInput";      
      var websocketCamera;
      var websocketCarInput;
      var isPatrolling = false;
      
      function initCameraWebSocket() {
        websocketCamera = new WebSocket(webSocketCameraUrl);
        websocketCamera.binaryType = 'blob';
        websocketCamera.onclose   = function(event){setTimeout(initCameraWebSocket, 2000);};
        websocketCamera.onmessage = function(event) {
          var imageId = document.getElementById("cameraImage");
          imageId.src = URL.createObjectURL(event.data);
        };
      }
      
      function initCarInputWebSocket() {
        websocketCarInput = new WebSocket(webSocketCarInputUrl);
        websocketCarInput.onopen = function(event) {
          sendButtonInput("Speed", document.getElementById("Speed").value);
          sendButtonInput("Light", document.getElementById("Light").value);
        };
        websocketCarInput.onclose = function(event){setTimeout(initCarInputWebSocket, 2000);};
        websocketCarInput.onmessage = function(event) {
            // Handle Notifications from ESP32
            var msg = event.data;
            if(msg.startsWith("notify:")) {
                var text = msg.substring(7);
                var notifDiv = document.getElementById("notificationArea");
                notifDiv.innerText = text;
                notifDiv.style.display = "block";
                setTimeout(function(){ notifDiv.style.display = "none"; }, 5000);
            }
        };        
      }
      
      function initWebSocket() {
        initCameraWebSocket();
        initCarInputWebSocket();
      }

      function sendButtonInput(key, value) {
        var data = key + "," + value;
        websocketCarInput.send(data);
      }

      function togglePatrol() {
          var btn = document.getElementById("patrolBtn");
          if(!isPatrolling) {
             var mins = document.getElementById("patrolTime").value;
             sendButtonInput("PatrolStart", mins);
             btn.innerText = "Stop Patrol";
             btn.classList.add("stop");
             isPatrolling = true;
          } else {
             sendButtonInput("PatrolStop", "0");
             btn.innerText = "Start Patrol";
             btn.classList.remove("stop");
             isPatrolling = false;
          }
      }
    
      window.onload = initWebSocket;
      document.getElementById("mainTable").addEventListener("touchend", function(event){ event.preventDefault() });      
    </script>
  </body>    
</html>
